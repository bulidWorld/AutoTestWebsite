openapi: 3.0.3
info:
  title: 订单 API
  version: 2.0.0
servers:
  - url: https://api.example.com
paths:
  /orders/{order_id}:
    get:
      operationId: getOrder
      summary: 查询订单详情（更新）
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
            example: 10
        - name: verbose
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders:
    get:
      operationId: listOrders
      summary: 订单列表（新增，移除创建接口）
      responses:
        '200':
          description: 查询成功
components:
  schemas:
    Order:
      type: object
      required: [customer, items]
      properties:
        customer:
          type: object
          required: [name]
          properties:
            name:
              type: string
              example: 张三
        items:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
              price:
                type: number
              quantity:
                type: integer
                default: 1
