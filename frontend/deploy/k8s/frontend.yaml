apiVersion: v1
kind: ConfigMap
metadata:
  name: autotest-frontend-config
data:
  # 后端 Service 的名称与 port（不是 NodePort）。默认与前端同 namespace。
  BACKEND_UPSTREAM: "autotest-backend:31010"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autotest-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autotest-frontend
  template:
    metadata:
      labels:
        app: autotest-frontend
    spec:
      containers:
        - name: frontend
          # 部署前替换为实际镜像仓库和版本。
          image: YOUR_REGISTRY/autotest-frontend:1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: autotest-frontend-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: autotest-frontend
spec:
  type: NodePort
  selector:
    app: autotest-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31011
